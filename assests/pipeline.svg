    <circle cx="450" cy="180" r="3"/>
  </g>

  <!-- chips -->
  <g>
    <rect x="40" y="30" width="130" height="40" rx="6" fill="#111827" stroke="#2A3441"/>
    <text x="105" y="55" font-size="14" fill="#E6EDF3" text-anchor="middle">DATA</text>

    <rect x="230" y="30" width="110" height="40" rx="6" fill="#111827" stroke="#2A3441"/>
    <text x="285" y="55" font-size="14" fill="#E6EDF3" text-anchor="middle">ML</text>

    <rect x="400" y="30" width="170" height="40" rx="6" fill="#111827" stroke="#3A5A82"/>
    <text x="485" y="55" font-size="13" fill="#E6EDF3" text-anchor="middle">DEEP LEARNING</text>

    <rect x="330" y="120" width="110" height="40" rx="6" fill="#111827" stroke="#2A3441"/>
    <text x="385" y="145" font-size="14" fill="#E6EDF3" text-anchor="middle">NLP</text>

