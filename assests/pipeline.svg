    <rect x="228" y="48" width="4" height="4"/>
    <rect x="338" y="48" width="4" height="4"/>
    <rect x="398" y="48" width="4" height="4"/>
    <rect x="383" y="118" width="4" height="4"/>
    <rect x="383" y="158" width="4" height="4"/>
    <rect x="613" y="118" width="4" height="4"/>
    <rect x="613" y="158" width="4" height="4"/>
    <rect x="448" y="198" width="4" height="4"/>
    <rect x="448" y="238" width="4" height="4"/>
    <rect x="448" y="268" width="4" height="4"/>
  </g>
  <g fill="#8B7CF6">
