<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'JetBrains Mono','Fira Code','Roboto Mono',Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="898" height="318" rx="10" fill="#0D1117" stroke="#1C2430"/>

  <!-- traces -->
  <g fill="none" stroke="#2A5A8C" stroke-width="1.6">
    <path d="M170,50 L230,50"/>
    <path d="M340,50 L400,50"/>
