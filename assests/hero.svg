<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'JetBrains Mono','Fira Code','Roboto Mono',Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
