name: Update telemetry cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  push:
    paths:
      - ".github/workflows/telemetry.yml"
  workflow_dispatch:       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=4FA8FF&text_color=E6EDF3&icon_color=8B7CF6
          path: assets/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D1117&title_color=4FA8FF&text_color=E6EDF3
          path: assets/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&disable_animations=true&background=0D1117&stroke=1C2430&ring=4FA8FF&fire=4FA8FF&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=4FA8FF&sideLabels=6B7686
          path: assets/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg
          git commit -m "Update telemetry cards" || exit 0
          git push
