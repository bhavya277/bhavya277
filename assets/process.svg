<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'JetBrains Mono','Fira Code','Roboto Mono',Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4FA8FF"/>
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8B7CF6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="378" rx="10" fill="#0D1117" stroke="#1C2430"/>

  <!-- sequence arcs -->
  <g fill="none" stroke="#2A5A8C" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M462,86 A110,110 0 0,1 546,131"/>
    <path d="M553,138 A110,110 0 0,1 567,224"/>
    <path d="M562,232 A110,110 0 0,1 508,299"/>
    <path d="M493,301 A110,110 0 0,1 407,301"/>
    <path d="M392,299 A110,110 0 0,1 338,232"/>
    <path d="M333,224 A110,110 0 0,1 347,138"/>
  </g>

  <!-- feedback / iterate arrow -->
  <path d="M354,131 A150,150 0 0,1 446,86" fill="none" stroke="#8B7CF6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowViolet)">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <text x="450" y="55" font-size="11" fill="#8B7CF6" text-anchor="middle" letter-spacing="1">ITERATE</text>

  <!-- nodes -->
  <g>
    <circle cx="450" cy="80" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="450" y="30" font-size="13" fill="#E6EDF3" text-anchor="middle">UNDERSTAND</text>

    <circle cx="559" cy="131" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="618" y="95" font-size="13" fill="#E6EDF3" text-anchor="middle">EXPERIMENT</text>

    <circle cx="580" cy="228" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="650" y="235" font-size="13" fill="#E6EDF3" text-anchor="middle">BUILD</text>

    <circle cx="521" cy="305" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="540" y="345" font-size="13" fill="#E6EDF3" text-anchor="middle">BREAK</text>

    <circle cx="379" cy="305" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="358" y="345" font-size="13" fill="#E6EDF3" text-anchor="middle">ANALYZE</text>

    <circle cx="320" cy="228" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="250" y="235" font-size="13" fill="#E6EDF3" text-anchor="middle">IMPROVE</text>

    <circle cx="341" cy="131" r="7" fill="#0D1B2E" stroke="#4FA8FF" stroke-width="1.6"/>
    <text x="282" y="95" font-size="13" fill="#E6EDF3" text-anchor="middle">SHIP</text>
  </g>

  <text x="34" y="18" font-size="10" letter-spacing="1" fill="#6B7686">FIG.2  CLOSED-LOOP PROCESS</text>
</svg>
